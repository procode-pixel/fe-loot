name: daily-health
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public pages
        run: |
          set -e
          base="${SITE_URL:-https://fe-loot-v0.vercel.app}"
          for path in / /status /setup /api/health /security; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" -L --max-time 20 "$base$path")
            echo "$path $code"
            test "$code" = "200"
          done
          grep -q "ok\\|status\\|FeLoot\\|feloot" /tmp/body || true
