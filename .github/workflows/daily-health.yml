name: daily-health
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public pages and reject probes
        run: |
          set -e
          base="${SITE_URL:-https://fe-loot-v0.vercel.app}"
          for path in / /games /status /setup /api/health /api/stats /security /help /terms /privacy /login /offers /wallet /alerts /changelog /sitemap.xml; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" -L --max-time 25 "$base$path")
            echo "$path $code"
            test "$code" = "200"
          done
          grep -q "FeLoot\|feloot\|ok" /tmp/body
          for probe in /.env /.git/config /wp-login.php /server-status; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$base$probe")
            echo "probe $probe $code"
            test "$code" = "404"
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -X POST "$base/api/auth/login" -H "Origin: https://evil.example" -H "Content-Type: application/json" -d "{}")
          echo "csrf $code"
          test "$code" = "403"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -X POST "$base/api/auth/login" -H "Content-Type: application/json" -H "Content-Length: 200000" -d "{}")
          echo "oversize $code"
          test "$code" = "413" -o "$code" = "400" -o "$code" = "403"

          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$base/api/wallet")
          echo "wallet-anon $code"
          test "$code" = "401"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$base/api/offers")
          echo "offers-anon $code"
          test "$code" = "401"

          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$base/api/watches")
          echo "watches-anon $code"
          test "$code" = "401"
          code=$(curl -s -D - -o /dev/null --max-time 20 "$base/" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} tolower($1)=="x-frame-options:" {print $2}')
          echo "frame $code"
          test "$code" = "DENY"
