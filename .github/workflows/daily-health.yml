name: daily-health
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public pages and reject probes
        run: |
          set -e
          base="${SITE_URL:-https://fe-loot-v0.vercel.app}"
          for path in / /status /setup /api/health /security /help /terms /privacy /login; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" -L --max-time 25 "$base$path")
            echo "$path $code"
            test "$code" = "200"
          done
          grep -q "FeLoot\|feloot\|ok" /tmp/body
          for probe in /.env /.git/config /wp-login.php /server-status; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$base$probe")
            echo "probe $probe $code"
            test "$code" = "404"
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -X POST "$base/api/auth/login" -H "Origin: https://evil.example" -H "Content-Type: application/json" -d "{}")
          echo "csrf $code"
          test "$code" = "403"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -X POST "$base/api/auth/login" -H "Content-Type: application/json" -H "Content-Length: 200000" -d "{}")
          echo "oversize $code"
          test "$code" = "413" -o "$code" = "400" -o "$code" = "403"
